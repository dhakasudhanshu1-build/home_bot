controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_cont:
      type: diff_drive_controller/DiffDriveController

diff_cont:
  ros__parameters:

    left_wheel_names: ["Revolute_1"]
    right_wheel_names: ["Revolute_2"]

    wheel_separation: 0.38
    wheel_radius: 0.06

    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    use_stamped_vel: false